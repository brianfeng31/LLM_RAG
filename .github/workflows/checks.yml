name: RAG tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ollama>=0.6,<1' 'pandas>=2.2,<4' 'scikit-learn>=1.5,<2'
      - run: python -m unittest discover -s tests -v
